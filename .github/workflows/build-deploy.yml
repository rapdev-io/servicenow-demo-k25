name: Build-Deploy

on:
  push:
    branches: [ main ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: SN Register Artifact
        uses: ServiceNow/servicenow-devops-register-artifact@v5.1.0
        with:
          devops-integration-token: ${{ secrets.SN_TOKEN }}
          instance-url: ${{ secrets.SN_URL }}
          tool-id: ${{ secrets.SN_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: ${{ github.job }}
          artifacts: '[{"name": "demo-k25-gha", "version": "1.${{ github.run_number }}.0", "repositoryName": "${{ github.repository }}"}]'
  
  test:
    needs: build 
    runs-on: ubuntu-latest
    steps:
      - run: sleep 120

  echo-job:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo job

  skip-job:
    needs: echo-job
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - run: echo skip

  package-registration:
    needs: skip-job
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: SN Register Package
        uses: ServiceNow/servicenow-devops-register-package@v5.1.0
        with:
          devops-integration-token: ${{ secrets.SN_TOKEN }}
          instance-url: ${{ secrets.SN_URL }}
          tool-id: ${{ secrets.SN_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: ${{ github.job }}
          artifacts: '[{"name": "demo-k25-gha", "version": "1.${{ github.run_number }}.0", "repositoryName": "${{ github.repository }}"}]'
          package-name: 'demo-k25-gha-package - ${{ github.run_number }}'
          
      - name: ServiceNow DevOps Change Automation
        uses: ServiceNow/servicenow-devops-change@v6.0.0
        with:
          instance-url: ${{ secrets.SN_URL }}
          devops-integration-token: ${{ secrets.SN_TOKEN }}
          tool-id: ${{ secrets.SN_TOOL_ID }}
          job-name: ${{ github.job }}
          context-github: ${{ toJSON(github) }}
          change-request: '{}'
          deployment-gate: '{"environment":"Production","jobName":"deploy"}'
    
  deploy:
    needs: package-registration
    environment: Production
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Run a one-line script
        run: echo Deploying Application...
